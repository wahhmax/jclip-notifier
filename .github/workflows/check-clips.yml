name: JOTTA Clip Watcher

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jotta-clip-watcher
  cancel-in-progress: false

jobs:
  check-clips:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run JOTTA Clip Watcher
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          DISCORD_CLIP_WEBHOOK_URL: ${{ secrets.DISCORD_CLIP_WEBHOOK_URL }}
          DISCORD_KICK_CLIP_WEBHOOK_URL: ${{ secrets.DISCORD_KICK_CLIP_WEBHOOK_URL }}
        run: python src/main.py

      - name: Save state.json
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json

          if git diff --cached --quiet; then
            echo "ℹ️ Não há alterações no state.json."
          else
            git commit -m "Update clip watcher state"
            git push
          fi
