name: Tests Clip Watcher

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
